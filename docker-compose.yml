# docker-compose — Multi-Application Next.js Portal
#
# 端口分配：
#   ml-model      8000  Task 1 ML 推理容器
#   app1-backend  8001  FastAPI（Phase 1 加入）
#   app2-backend  8080  Spring Boot（Phase 4 加入）
#   portal        3000  Next.js（Phase 2 加入）
#
# 服务按 Phase 进度逐步加入：当前仅包含 ml-model，保证 compose 始终可运行。

services:
  ml-model:
    # Task 1 代码库在仓库之外；如需在其他机器构建，先将 Task 1 复制到本仓库同级或调整此路径
    build: ../interview-task
    image: housing-price-api
    container_name: ml-model
    ports:
      - "8000:8000"

  app1-backend:
    build: ./app1-backend
    container_name: app1-backend
    environment:
      # compose 网络内通过服务名访问 ML 容器
      ML_MODEL_URL: http://ml-model:8000
      # SQLite 文件放在挂载卷中，容器重建后历史记录不丢失
      DATABASE_URL: sqlite+aiosqlite:////data/estimates.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - app1-data:/data
    ports:
      - "8001:8001"
    depends_on:
      - ml-model

  portal:
    build: ./portal
    container_name: portal
    # 说明：前端通过浏览器直连后端（默认 http://localhost:8001 / :8080，见 portal/lib/config.ts）。
    # NEXT_PUBLIC_* 变量在构建期内联，若需改动须作为 build args 传入而非此处 environment。
    environment:
      # RSC 服务端数据获取走 compose 内部网络（运行时读取，非构建期内联）
      APP1_API_URL_SERVER: http://app1-backend:8001
    ports:
      - "3000:3000"
    depends_on:
      - app1-backend

volumes:
  app1-data:
